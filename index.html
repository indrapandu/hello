<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kabar Hari Ini</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --sky-top:#BFE3EE;
    --cream:#FBF3E7;
    --paper:#FFFDF8;
    --ink:#1F3A5F;
    --ink-soft:rgba(31,58,95,0.62);
    --coral:#FF6F59;
    --teal:#2A9D8F;
    --sand:#E8B75D;
    --line:rgba(31,58,95,0.22);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Plus Jakarta Sans', sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--cream) 48%);
    display:flex;
    justify-content:center;
    padding:32px 16px 56px;
  }

  .card{
    position:relative;
    width:100%;
    max-width:440px;
    background:var(--paper);
    border-radius:22px;
    box-shadow:0 18px 40px -20px rgba(31,58,95,0.35);
    overflow:hidden;
    animation:riseIn .55s ease-out;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .airmail{
    height:9px;
    background:repeating-linear-gradient(-45deg,
      var(--coral) 0 9px,
      var(--paper) 9px 13px,
      var(--teal) 13px 22px,
      var(--paper) 22px 26px);
  }

  .header{
    position:relative;
    padding:26px 26px 18px;
  }

  .stamp{
    position:absolute;
    top:18px;
    right:20px;
    width:78px;
    height:78px;
    transform:rotate(9deg);
    opacity:0.85;
  }
  .stamp circle{ fill:none; stroke:var(--coral); stroke-width:2.5; stroke-dasharray:5 4; }
  .stamp text{ fill:var(--ink); font-family:'Plus Jakarta Sans', sans-serif; font-weight:700; }
  .stamp .plane{ fill:var(--ink); }

  h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:2.6rem;
    line-height:1;
    margin:0 0 6px;
    padding-right:70px;
  }

  .squiggle{ width:128px; height:12px; margin-bottom:12px; }
  .squiggle path{ fill:none; stroke:var(--coral); stroke-width:3; stroke-linecap:round; }

  .subtitle{
    margin:0;
    font-size:0.95rem;
    color:var(--ink-soft);
    padding-right:70px;
  }

  .tear{
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 18px;
  }
  .tear::before, .tear::after{ content:""; width:9px; height:9px; border-radius:50%; background:var(--sky-top); flex:0 0 auto; }
  .tear .dashes{ flex:1; height:0; border-top:2px dashed var(--line); }

  .body{ padding:20px 26px 26px; }

  fieldset{ border:none; margin:0 0 20px; padding:0; }

  legend{
    font-weight:600;
    font-size:0.98rem;
    margin-bottom:10px;
    padding:0;
  }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }

  .chips input{
    position:absolute;
    opacity:0;
    width:1px; height:1px;
  }

  .chip{
    display:inline-flex;
    align-items:center;
    padding:9px 15px;
    border:1.6px solid var(--ink);
    border-radius:999px;
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    background:var(--paper);
    color:var(--ink);
    transition:background .15s ease, color .15s ease, transform .12s ease;
    user-select:none;
  }

  .chip:hover{ background:rgba(31,58,95,0.06); }

  .chips input:checked + .chip{
    background:var(--ink);
    color:var(--paper);
    transform:scale(1.04);
  }

  .chips input:focus-visible + .chip{
    outline:2.5px solid var(--coral);
    outline-offset:2px;
  }

  textarea{
    width:100%;
    min-height:74px;
    resize:vertical;
    border:none;
    border-radius:10px;
    padding:12px 14px;
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:0.92rem;
    color:var(--ink);
    background:repeating-linear-gradient(var(--paper) 0 27px, var(--line) 27px 28px);
    background-color:var(--paper);
    box-shadow:inset 0 0 0 1.6px var(--line);
  }
  textarea:focus-visible{ outline:2.5px solid var(--coral); outline-offset:2px; }

  .send-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:14px 18px;
    border:none;
    border-radius:999px;
    background:var(--ink);
    color:var(--paper);
    font-family:'Plus Jakarta Sans', sans-serif;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  .send-btn:hover{ background:#16283F; }
  .send-btn:active{ transform:scale(0.98); }
  .send-btn svg{ width:19px; height:19px; }

  .hint{
    min-height:18px;
    margin-top:10px;
    font-size:0.82rem;
    color:var(--coral);
    text-align:center;
  }

  .shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<form class="card" id="kabarForm">
  <div class="airmail"></div>

  <div class="header">
    <svg class="stamp" viewBox="0 0 120 120" aria-hidden="true">
      <circle cx="60" cy="60" r="50" />
      <defs>
        <path id="arcTop" d="M 14,62 A 46,46 0 0 1 106,62" />
        <path id="arcBottom" d="M 106,60 A 46,46 0 0 1 14,60" />
      </defs>
      <text font-size="11" letter-spacing="1.5"><textPath href="#arcTop" startOffset="50%" text-anchor="middle">SIAP</textPath></text>
      <text font-size="11" letter-spacing="1.5"><textPath href="#arcBottom" startOffset="50%" text-anchor="middle">TERBANG?</textPath></text>
      <path class="plane" transform="translate(46,50) scale(0.9)" d="M14 0L0 6.5l5.6 1.6L9 14l2.2-5.6L17 11 14 0z"/>
    </svg>

    <h1>Kabar hari ini</h1>
    <svg class="squiggle" viewBox="0 0 128 12" aria-hidden="true">
      <path d="M2 8 Q 16 0, 30 8 T 58 8 T 86 8 T 114 8" />
    </svg>
    <p class="subtitle">Cerita bentar ke aku, nanti tinggal pencet kirim.</p>
  </div>

  <div class="tear"><span class="dashes"></span></div>

  <div class="body">

    <fieldset id="f-kabar">
      <legend>1. Apa kabar?</legend>
      <div class="chips">
        <input type="radio" name="kabar" id="kabar-baik" value="Baik">
        <label class="chip" for="kabar-baik">Baik</label>
        <input type="radio" name="kabar" id="kabar-enggabaik" value="Engga Baik">
        <label class="chip" for="kabar-enggabaik">Engga Baik</label>
        <input type="radio" name="kabar" id="kabar-biasa" value="Biasa aja">
        <label class="chip" for="kabar-biasa">Biasa aja</label>
      </div>
    </fieldset>

    <fieldset id="f-healing">
      <legend>2. Butuh healing?</legend>
      <div class="chips">
        <input type="radio" name="healing" id="healing-engga" value="Engga">
        <label class="chip" for="healing-engga">Engga</label>
        <input type="radio" name="healing" id="healing-mau" value="Mau">
        <label class="chip" for="healing-mau">Mau</label>
        <input type="radio" name="healing" id="healing-biasa" value="Mau tapi biasa aja">
        <label class="chip" for="healing-biasa">Mau tapi biasa aja</label>
      </div>
    </fieldset>

    <fieldset id="f-paspor">
      <legend>3. Paspor ada?</legend>
      <div class="chips">
        <input type="radio" name="paspor" id="paspor-belum" value="Belum diurus">
        <label class="chip" for="paspor-belum">Belum diurus</label>
        <input type="radio" name="paspor" id="paspor-ada" value="Ada">
        <label class="chip" for="paspor-ada">Ada</label>
        <input type="radio" name="paspor" id="paspor-males" value="Ada tapi males">
        <label class="chip" for="paspor-males">Ada tapi males</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>4. Ada pesen?</legend>
      <textarea id="pesan" placeholder="Tulis pesen buat dia di sini..."></textarea>
    </fieldset>

    <button type="submit" class="send-btn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M21 3L2 10.5l6.5 2.5L11 20l3.5-5.5L21 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      Hit me!
    </button>
    <div class="hint" id="hint"></div>
  </div>
</form>

<script>
  const phrase = {
    kabar: {
      "Baik": "Kabar ku baik",
      "Engga Baik": "Kabar ku lagi engga baik",
      "Biasa aja": "Kabar ku biasa aja"
    },
    healing: {
      "Engga": "Aku engga butuh healing",
      "Mau": "Aku mau healing",
      "Mau tapi biasa aja": "Aku mau healing tapi biasa aja sih"
    },
    paspor: {
      "Belum diurus": "Paspor belum diurus",
      "Ada": "Paspor udah ada",
      "Ada tapi males": "Paspor ada tapi males dipake"
    }
  };

  const form = document.getElementById('kabarForm');
  const hint = document.getElementById('hint');
  const pesanBox = document.getElementById('pesan');

  function getSelected(name){
    const el = form.querySelector(`input[name="${name}"]:checked`);
    return el ? el.value : null;
  }

  function buildMessage(){
    const k = getSelected('kabar');
    const h = getSelected('healing');
    const p = getSelected('paspor');
    const msg = pesanBox.value.trim();

    if(!k || !h || !p) return null;

    let out = `${phrase.kabar[k]}. ${phrase.healing[h]}. ${phrase.paspor[p]}.`;
    if(msg) out += ` ${msg}`;
    return out;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const built = buildMessage();

    if(!built){
      ['f-kabar','f-healing','f-paspor'].forEach(id => {
        const fs = document.getElementById(id);
        if(!fs.querySelector('input:checked')){
          fs.classList.remove('shake');
          void fs.offsetWidth;
          fs.classList.add('shake');
        }
      });
      hint.textContent = "Yuk lengkapin dulu tiga pertanyaan pertama ya 🙏";
      return;
    }

    hint.textContent = "";
    const url = `https://wa.me/?text=${encodeURIComponent(built)}`;
    window.open(url, '_blank');
  });
</script>

</body>
</html>
